# In-cluster Ollama model server. kagent needs an LLM endpoint; Ollama keeps
# the hello-world demo keyless and free (no API key, no Secret, no billing).
# The model itself is pulled at deploy time (see Makefile `model` target) so
# the image stays small and the model choice stays a one-line change.
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.11.8
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        # emptyDir: models re-pull on pod restart. Fine for a demo cluster;
        # a PVC would outlive the pod but P1 keeps moving parts minimal.
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: http
