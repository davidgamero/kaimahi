# Hosted-model preset: OpenAI (first-party API).
#
#   make model-secret NAME=openai-api-key
#   make use PRESET=openai
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: openai
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-4o-mini
  apiKeySecret: openai-api-key
  apiKeySecretKey: api-key
  openAI: {}
