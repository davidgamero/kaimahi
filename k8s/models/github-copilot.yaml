# Hosted-model preset: GitHub Copilot subscription (OpenAI models).
#
# A Copilot plan includes API access to OpenAI (and other) models at
# api.githubcopilot.com — an OpenAI-compatible endpoint. Auth is a
# short-lived Copilot token minted via GitHub device login:
#   make copilot-secret        # device login -> exchange -> K8s Secret
#   make use PRESET=github-copilot
#
# Caveats (details in docs/models.md): the endpoint is not part of
# GitHub's documented public API surface; the minted token expires and
# copilot-secret must be re-run; usage draws on your Copilot plan.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: github-copilot
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-5-mini
  apiKeySecret: github-copilot-token
  apiKeySecretKey: api-key
  defaultHeaders:
    Copilot-Integration-Id: vscode-chat
    Editor-Version: vscode/1.103.0
  openAI:
    baseUrl: https://api.githubcopilot.com
