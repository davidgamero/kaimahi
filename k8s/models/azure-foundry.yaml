# Hosted-model preset: Azure AI Foundry, v1 GA API (OpenAI-compatible).
#
# Deliberately NOT kagent's `provider: AzureOpenAI`: that provider requires
# an `apiVersion` field, which belongs to the legacy per-version Azure API.
# The Foundry v1 GA surface is a plain OpenAI-compatible endpoint with no
# api-version parameter, so it rides `provider: OpenAI` + baseUrl instead
# (board ruling; details in docs/models.md).
#
# Edit before use:
#   - baseUrl: replace YOUR-RESOURCE with your Foundry/Azure OpenAI resource
#   - model: your DEPLOYMENT name (not the upstream model name)
#
#   make model-secret NAME=azure-foundry-api-key
#   make use PRESET=azure-foundry
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: azure-foundry
  namespace: kagent
spec:
  provider: OpenAI
  model: gpt-4o-mini
  apiKeySecret: azure-foundry-api-key
  apiKeySecretKey: api-key
  openAI:
    baseUrl: https://YOUR-RESOURCE.openai.azure.com/openai/v1
