# Local-model preset: in-cluster Ollama (keyless, free — the P1 path).
#
# Identical in substance to hello-world-model in k8s/hello-world.yaml (which
# stays self-contained as the P1 demo artifact); this copy exists so every
# model target, local or hosted, switches the same way:
#   make use PRESET=ollama
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: ollama
  namespace: kagent
spec:
  provider: Ollama
  model: qwen2.5:3b
  ollama:
    host: http://ollama.ollama.svc.cluster.local:11434
