name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job: checkout needs repository read, nothing
# needs more.
permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          test -f LICENSE
          test -f README.md
          test -f docs/COORDINATION.md
      - name: All YAML parses
        run: |
          python3 - <<'EOF'
          import pathlib, sys, yaml
          failed = False
          for p in pathlib.Path(".").rglob("*.y*ml"):
              if ".git" in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except Exception as e:
                  print(f"{p}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
      - name: No secrets in tree
        # Fail closed: distinguish "no match" (grep exit 1, pass) from both
        # "match found" (exit 0) and "scanner failed to run" (exit >= 2) —
        # a bare `! grep` lets a grep error pass the gate.
        run: |
          set +e
          grep -rEIn --exclude-dir=.git \
            '(sk[-]ant-|sk[-]proj-|api[_-]?key[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_-]{20,})' .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "possible credential committed"; exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "secret scan failed to run (grep exit $rc)"; exit 1
          fi
      # P5b: this repo is public and now documents a managed-cluster path.
      # A subscription/tenant GUID, an AKS FQDN, or a real ACR login server
      # must never land in the tree — every Azure identifier is supplied by
      # the operator at run time. The same script is what the operator runs
      # locally while writing up an AKS run.
      - name: No Azure identifiers in tree
        run: bash scripts/check-no-azure-ids.sh
      # P5b: the context guard is pure policy — every branch of it decides
      # whether to touch somebody's cluster — but the e2e job below can only
      # ever exercise the one branch it runs on (local kind). These tests
      # build their own kubeconfig, so all of them are covered keyless in
      # seconds: local kind proceeds, an unwritten kind context proceeds
      # (that is `make up` on an empty machine), and a typo, a kind-NAMED
      # remote, a remote with no confirmation, and a confirmation naming a
      # different context are all refused.
      - name: Context guard fails closed
        run: bash scripts/kube-guard-test.sh
      # P5b: kind keeps `imagePullPolicy: Never` (deliberate — a side-loaded
      # local tag must never fall back to pulling a squattable public name),
      # so a registry-backed cluster needs both the image and the policy
      # rendered at deploy time. Assert the render without a cluster:
      # KUBECTL=true makes the applies no-ops while the transform and its
      # fail-closed verification still run for real.
      - name: Registry render swaps image and pull policy
        run: |
          KUBECTL=true PLANE_TARGET=registry \
            PLANE_IMAGE=registry.example/kaimahi-proxy:test \
            PLANE_PULL_POLICY=IfNotPresent \
            bash scripts/plane-deploy.sh 2>&1 | tee render.out
          grep -q 'image=registry.example/kaimahi-proxy:test pullPolicy=IfNotPresent' render.out
          # `Never` on a registry target would mean ErrImageNeverPull
          # forever, so the script must refuse it outright.
          set +e
          KUBECTL=true PLANE_TARGET=registry \
            PLANE_IMAGE=registry.example/kaimahi-proxy:test \
            PLANE_PULL_POLICY=Never \
            bash scripts/plane-deploy.sh >never.out 2>&1
          rc=$?
          set -e
          # Assert WHY it failed, not just that it did: any nonzero exit
          # would satisfy a bare rc check, including a ModuleNotFoundError
          # that never reached the policy check at all.
          test "$rc" -ne 0 || { echo 'pull policy Never accepted on a registry target'; exit 1; }
          grep -q "refusing pull policy 'Never'" never.out
          # ...and a registry target with no image at all must not deploy
          # the committed local tag by accident.
          set +e
          KUBECTL=true PLANE_TARGET=registry bash scripts/plane-deploy.sh >noimg.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo 'registry target deployed with no PLANE_IMAGE'; exit 1; }
          grep -q 'PLANE_IMAGE is required' noimg.out
          # The committed manifest itself must still be the kind one.
          # Parsed, not grepped: the string "imagePullPolicy: Never" also
          # appears in that file's own comments, so a grep would keep
          # passing after the real field was deleted.
          python3 - <<'EOF'
          import sys, yaml
          policies = [
              c["imagePullPolicy"]
              for d in yaml.safe_load_all(open("k8s/plane/proxy.yaml"))
              if d and d.get("kind") == "Deployment"
              for c in d["spec"]["template"]["spec"]["containers"]
              if c["name"] == "proxy"
          ]
          assert policies == ["Never"], f"committed proxy pull policy: {policies}"
          EOF

  # P4a: the governance plane's Go module — build, vet, gofmt, tests.
  # A separate quick job so proxy logic failures surface in seconds, not
  # after a 6-minute cluster bring-up.
  go-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plane
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: plane/go.mod
          cache-dependency-path: plane/go.sum
      - name: gofmt clean
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  # The P1 deliverable, verified for real: kind cluster, in-cluster Ollama,
  # kagent via helm, apply k8s/hello-world.yaml, converse via the kagent CLI.
  e2e-hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # An explicit bash shell turns on `-o pipefail`, so the
        # `make chat | tee` pipelines fail on make's own exit code instead
        # of relying solely on the content check in verify-chat.py.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install kind
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Cluster + Ollama + model + kagent + agent
        run: make up
      - name: Converse with the agent
        run: |
          make chat | tee chat.out
          # Fail closed: require a completed A2A task with non-empty reply text.
          python3 scripts/verify-chat.py chat.out
      # P2, keyless: the model presets must be schema-valid against the live
      # CRDs, and the preset-switch mechanism must work end to end. No hosted
      # keys in CI (public repo, fork-exposed PR CI) — the switch is exercised
      # with the keyless in-cluster Ollama preset.
      - name: Validate model presets against live CRDs (server dry-run)
        run: kubectl --context kind-kaimahi-p1 apply --dry-run=server -f k8s/models/
      - name: Switch preset and converse again (keyless)
        run: |
          make use PRESET=ollama
          make chat | tee chat-preset.out
          python3 scripts/verify-chat.py chat-preset.out
      # P3, keyless: prove a REAL MCP tool call, not a plausible answer. A
      # ConfigMap with an unguessable random name is created, the tools
      # agent is asked to list configmaps, and the verifier requires a
      # function_call + successful function_response for k8s_get_resources
      # in the A2A history AND the random name in the reply — data the
      # model can only have via the live tool round-trip. Fail-closed.
      # Helm never validates values keys against the subchart, so a typo'd
      # or renamed lockdown knob would silently deploy the tool server wide
      # open while everything still reads Ready. Assert the posture instead
      # of trusting the values: read-only mode logged, and the tool server's
      # ServiceAccount can neither read Secrets nor write anything.
      - name: Assert tool-server lockdown posture
        run: |
          kubectl --context kind-kaimahi-p1 -n kagent logs deploy/kagent-tools \
            > tools.log
          grep -q 'Running in read-only mode' tools.log
          # `! cmd` is exempt from errexit, so compare can-i's answer
          # explicitly — each check aborts the step on the wrong answer.
          secrets=$(kubectl --context kind-kaimahi-p1 auth can-i get secrets \
            --as=system:serviceaccount:kagent:kagent-tools || true)
          test "$secrets" = no
          writes=$(kubectl --context kind-kaimahi-p1 auth can-i create pods \
            --as=system:serviceaccount:kagent:kagent-tools || true)
          test "$writes" = no
          kubectl --context kind-kaimahi-p1 auth can-i list pods \
            --as=system:serviceaccount:kagent:kagent-tools
      - name: Tool call through MCP (keyless)
        run: |
          probe="probe-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          kubectl --context kind-kaimahi-p1 -n default create configmap "$probe" \
            --from-literal=owner=kaimahi-p3-ci
          make chat AGENT=hello-tools \
            TASK='List the configmaps in the default namespace.' | tee tool-chat.out
          python3 scripts/verify-chat.py tool-chat.out k8s_get_resources "$probe"
      # P4a, keyless: the governance plane in the SAME cluster/job — a
      # separate e2e job would repeat the whole bring-up for no coverage
      # gain; instead the plane's requests are trimmed (postgres 50m,
      # proxy 25m) to fit the 2-CPU runner's request ceiling (P3 delta).
      # Chat rides the governed ollama path via the proxy; the ledger row
      # and the budget denial are asserted fail-closed.
      # Preset switches roll the agent Deployment with maxSurge=1, so the
      # node must fit a SECOND agent pod's requests while the old one
      # drains. With the plane deployed the 2-CPU node cannot fit a
      # second 100m/384Mi hello-world, so shrink its runtime requests to
      # hello-tools' proven values (P3 delta) via the Agent CRD — the P1
      # artifact k8s/hello-world.yaml stays untouched; this is a CI
      # sizing patch, not a topology change.
      - name: Shrink hello-world requests so preset switches can surge
        run: |
          kubectl --context kind-kaimahi-p1 -n kagent patch agent hello-world \
            --type merge -p '{"spec":{"declarative":{"deployment":{"resources":{"requests":{"cpu":"50m","memory":"320Mi"},"limits":{"memory":"1Gi"}}}}}}'
          kubectl --context kind-kaimahi-p1 -n kagent rollout status deploy/hello-world --timeout=300s
      - name: Deploy the governance plane
        run: make plane
      - name: Issue governed credential and switch agent through the proxy
        run: make govern
      - name: Governed chat via the proxy
        run: |
          make chat | tee governed-chat.out
          python3 scripts/verify-chat.py governed-chat.out
      - name: Assert the ledger recorded the governed chat
        run: |
          make ledger | tee ledger.out
          # Fail closed: a free-tier row for the governed chat with real
          # token counts, and a non-zero month-to-date token total.
          grep -E 'hello-world +ollama +qwen2\.5:3b +[0-9]+ +[0-9]+ +0 +free +200' ledger.out
          python3 - <<'EOF'
          import re, sys
          m = re.search(r"month to date: (\d+) cents, (\d+) tokens", open("ledger.out").read())
          sys.exit(0 if m and int(m.group(2)) > 0 else 1)
          EOF
      - name: Budget exhaustion fails closed
        run: |
          make budget CAP_TOKENS=1
          # The same chat must now fail with the meter's clear error; the
          # task must NOT complete. kagent may exit nonzero on a failed
          # task, so capture output regardless and assert on content.
          make chat > denied-chat.out 2>&1 || true
          cat denied-chat.out
          grep -q 'monthly token budget reached' denied-chat.out
          grep -q '"state":"failed"' denied-chat.out
          # `! cmd` is exempt from errexit (see the lockdown step above),
          # so assert the absence explicitly.
          if grep -q '"state":"completed"' denied-chat.out; then
            echo 'chat completed despite exhausted budget' >&2; exit 1
          fi
          make ledger | tee ledger-denied.out
          grep -E 'denied +429' ledger-denied.out
      # P4b, keyless: the enforcing MCP gateway in the same cluster/job.
      # No new pods (the gateway is a second listener in the existing
      # proxy pod — zero added CPU requests on the ~full node). The tools
      # agent is governed through the gateway, a REAL tool call is proven
      # with the P3 probe-ConfigMap pattern, the audit row is asserted,
      # and a NOT-allowlisted call is denied fail-closed and audited.
      - name: Govern the tools agent through the MCP gateway
        run: make govern-tools
      - name: Governed tool call rides the gateway (P3 probe proof)
        run: |
          probe="probe-$(od -An -N4 -tx4 /dev/urandom | tr -d ' ')"
          kubectl --context kind-kaimahi-p1 -n default create configmap "$probe" \
            --from-literal=owner=kaimahi-p4b-ci
          make chat AGENT=hello-tools \
            TASK='List the configmaps in the default namespace.' | tee gw-chat.out
          python3 scripts/verify-chat.py gw-chat.out k8s_get_resources "$probe"
      - name: Assert the audit recorded the governed tool call
        run: |
          make tool-audit | tee tool-audit.out
          grep -E 'hello-tools +kagent-tools +tools/call +k8s_get_resources +allowed +200' tool-audit.out
      - name: Non-allowlisted tool call denied fail-closed and audited
        run: |
          bash scripts/tool-denial-probe.sh k8s_describe_resource
          make tool-audit | tee tool-audit-denied.out
          grep -E 'hello-tools +kagent-tools +tools/call +k8s_describe_resource +denied +403' tool-audit-denied.out
      - name: Agent-side tool wiring carries only the kmh_ token
        run: |
          # The Secret value never leaves the pipe; grep -c prints only a
          # count. The RemoteMCPServer must reference the Secret (no
          # inline header value), and discovery through the gateway must
          # project exactly the allowlisted tool.
          n=$(kubectl --context kind-kaimahi-p1 -n kagent get secret kaimahi-tools-token \
            -o jsonpath='{.data.api-key}' | base64 -d | grep -cE '^kmh_[0-9a-f]{64}$')
          test "$n" = 1
          # Exactly one headersFrom entry, Secret-sourced (no inline value),
          # referencing kaimahi-tools-token — the complete credential set.
          kubectl --context kind-kaimahi-p1 -n kagent get remotemcpserver kaimahi-tools -o json \
            | python3 -c 'import json,sys; h=json.load(sys.stdin)["spec"]["headersFrom"]; assert len(h)==1 and "value" not in h[0] and h[0]["valueFrom"]=={"type":"Secret","name":"kaimahi-tools-token","key":"api-key"}, h'
          discovered=$(kubectl --context kind-kaimahi-p1 -n kagent get remotemcpserver kaimahi-tools \
            -o jsonpath='{.status.discoveredTools[*].name}')
          test "$discovered" = k8s_get_resources
      # P4c, keyless: both approval cycles asserted fail-closed in the
      # same cluster/job (zero CPU delta — approvals extend the existing
      # process). USES=1 bounds keep CI sleep-free: exhaustion, not
      # wall-clock expiry, proves grants end (TTL expiry is live-verified
      # in the PR).
      - name: "Approvals tool cycle: denied files request, bounded approval admits, exhaustion re-denies"
        run: |
          bash scripts/tool-denial-probe.sh k8s_get_events
          make approvals | tee approvals-tool.out
          id=$(awk '$3=="hello-tools" && $4=="tool" && $5=="k8s_get_events" {print $1}' approvals-tool.out)
          test -n "$id"
          make approve ID="$id" USES=1 TTL=10m
          bash scripts/tool-call-probe.sh k8s_get_events '{"namespace": "default"}'
          # The single use is consumed: the same call is denied again,
          # fail closed, and a fresh request is filed.
          bash scripts/tool-denial-probe.sh k8s_get_events
          make tool-audit | tee tool-audit-p4c.out
          grep -E 'hello-tools +kagent-tools +tools/call +k8s_get_events +allowed +200 +granted' tool-audit-p4c.out
      - name: "Approvals budget cycle: cap denial filed a request, bounded raise admits, exhaustion re-denies"
        run: |
          # The budget-exhaustion step above (CAP_TOKENS=1) already
          # denied a governed chat, which auto-filed this request:
          make approvals | tee approvals-budget.out
          id=$(awk '$3=="hello-world" && $4=="budget" && $5=="tokens" {print $1}' approvals-budget.out)
          test -n "$id"
          make approve ID="$id" USES=1 TTL=10m AMOUNT=1000000
          make chat | tee granted-chat.out
          python3 scripts/verify-chat.py granted-chat.out
          # Grant exhausted (USES=1): the next chat is denied again.
          make chat > overage-denied.out 2>&1 || true
          grep -q 'monthly token budget reached' overage-denied.out
          if grep -q '"state":"completed"' overage-denied.out; then
            echo 'chat completed despite exhausted grant' >&2; exit 1
          fi
          make approval-audit | tee approval-audit.out
          grep -E 'hello-world +budget +tokens +approved' approval-audit.out
          grep -E 'hello-tools +tool +k8s_get_events +approved' approval-audit.out
      # P5a, keyless: the governed Slack path. CI holds NO Slack token and
      # NO Copilot token (public, fork-exposed repo), so the Slack MCP
      # server is deliberately NOT deployed here. What that buys is an
      # honest boundary rather than a stand-in pretending to be Slack:
      # the gateway decides BEFORE it forwards, so the entire approval
      # cycle is exercised, the gateway then DIALS the committed slack
      # upstream, and the call answers 502 because no such Service
      # exists. A 200 would mean CI reached a tool server —
      # tool-admit-probe.sh fails on it.
      #
      # Be precise about what that does and does not prove. It proves the
      # allowlist/grant decisions and that an admitted call is forwarded.
      # It does NOT validate the upstream URL itself: any unreachable URL
      # answers 502 alike. And it does not cover the Slack MCP server
      # pod, its bot-token custody at runtime, the gateway relaying a
      # real Slack response, or Slack accepting the message. Those are
      # live-verified in the PR and nowhere else.
      - name: Slack manifests valid against the live CRDs (server dry-run)
        run: |
          kubectl --context kind-kaimahi-p1 apply --dry-run=server \
            -f k8s/slack-mcp.yaml -f k8s/kaimahi-slack.yaml -f k8s/slack-agent.yaml
      - name: Committed Slack wiring carries no credential
        run: |
          python3 - <<'EOF'
          import pathlib, sys, yaml
          fail = []
          mcp = yaml.safe_load(pathlib.Path("k8s/slack-mcp.yaml").read_text())
          dep = mcp["spec"]["deployment"]
          # Every secret-shaped value must arrive by secretRef; the
          # plaintext env map may hold only these non-secret knobs.
          allowed_env = {"SLACK_MCP_HOST", "SLACK_MCP_PORT", "SLACK_MCP_LOG_LEVEL"}
          extra = set(dep.get("env", {})) - allowed_env
          if extra:
              fail.append(f"secret-capable env in plaintext YAML: {sorted(extra)}")
          refs = {r["name"] for r in dep.get("secretRefs", [])}
          if refs != {"kaimahi-slack-bot", "kaimahi-slack-mcp-key"}:
              fail.append(f"unexpected secretRefs: {sorted(refs)}")
          # The image is pinned by digest: the bytes holding a workspace
          # token must be the bytes that were reviewed.
          if "@sha256:" not in dep["image"]:
              fail.append(f"Slack MCP image is not digest-pinned: {dep['image']}")
          # The agent-side seam sends only a Secret-resolved header.
          rms = yaml.safe_load(pathlib.Path("k8s/kaimahi-slack.yaml").read_text())
          h = rms["spec"]["headersFrom"]
          if len(h) != 1 or "value" in h[0] or h[0]["valueFrom"] != {
                  "type": "Secret", "name": "kaimahi-slack-token", "key": "api-key"}:
              fail.append(f"unexpected headersFrom: {h}")
          # The agent's toolNames is a SELECTION, not a grant: kagent wires
          # (discovered ∩ toolNames) and discovery runs through the gateway.
          # Assert it selects from the Slack seam only — the authority is the
          # plane's allowlist, checked dynamically below.
          agent = yaml.safe_load(pathlib.Path("k8s/slack-agent.yaml").read_text())
          tools = agent["spec"]["declarative"]["tools"]
          if len(tools) != 1 or tools[0]["mcpServer"]["name"] != "kaimahi-slack":
              fail.append(f"the demo agent reaches something other than the governed Slack seam: {tools}")
          if agent["spec"]["declarative"]["modelConfig"] != "governed-copilot":
              fail.append("the demo agent is not on a governed model preset")
          for line in fail:
              print(line)
          sys.exit(1 if fail else 0)
          EOF
          # No Slack token shape anywhere in the tree.
          set +e
          grep -rIn --exclude-dir=.git -E 'xox[bpca]-[A-Za-z0-9-]{10,}' .
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "possible Slack token committed (or scanner failed: exit $rc)"; exit 1; }
      - name: Gateway upstream table gained Slack, still entirely in-cluster
        run: |
          kubectl --context kind-kaimahi-p1 -n kaimahi get configmap kaimahi-upstreams \
            -o jsonpath='{.data.upstreams\.json}' > upstreams.json
          python3 - <<'EOF'
          import json, sys
          from urllib.parse import urlparse
          t = json.load(open("upstreams.json"))["tool_upstreams"]
          assert set(t) == {"kagent-tools", "slack"}, t
          # P4b's deferral of the hardened dialer / SSRF set holds only
          # while every tool upstream is in-cluster. Assert it, so an
          # internet-facing entry cannot be added without this failing.
          for name, up in t.items():
              host = urlparse(up["url"]).hostname
              assert host.endswith((".kaimahi", ".kagent", ".svc.cluster.local")), (name, host)
          # The Slack upstream is keyed from plane custody, and the table
          # names the file without ever carrying a value.
          slack = t["slack"]
          assert slack["credential_file"].startswith("/etc/kaimahi/upstream-creds/"), slack
          assert not any(k for k in slack if k in ("credential", "token", "api_key")), slack
          print("tool upstreams:", {k: urlparse(v["url"]).hostname for k, v in t.items()})
          EOF
      - name: Issue the Slack credential with a READ-ONLY allowlist
        run: |
          # No agent and no MCP server pod are created here: the node is
          # at ~92% of its CPU requests (P4a delta) and neither is needed
          # to exercise the gateway's decisions.
          KUBECTL="kubectl --context kind-kaimahi-p1" GOVERNED_SECRET=kaimahi-slack-token \
            bash scripts/plane-admin.sh issue hello-slack
          make slack-allow SLACK_TOOLS=conversations_history
          make tool-allowlist CRED_TOOLS=hello-slack | tee slack-allowlist.out
          grep -q conversations_history slack-allowlist.out
          # The authority: posting must NOT be allowlisted. `! cmd` is
          # exempt from errexit, so assert the absence explicitly.
          if grep -q conversations_add_message slack-allowlist.out; then
            echo 'posting is allowlisted — it must be approved, not configured' >&2; exit 1
          fi
          # Custody: the agent-side Secret holds ONLY an opaque kmh_ token.
          n=$(kubectl --context kind-kaimahi-p1 -n kagent get secret kaimahi-slack-token \
            -o jsonpath='{.data.api-key}' | base64 -d | grep -cE '^kmh_[0-9a-f]{64}$')
          test "$n" = 1
          # Give the gateway a throwaway upstream credential so it
          # actually DIALS the slack upstream instead of failing closed on
          # a missing Secret — that is what makes the admitted call's 502
          # mean "forwarded and unreachable" rather than "never sent".
          # This is NOT a Slack credential: no Slack token exists in CI.
          kubectl --context kind-kaimahi-p1 -n kaimahi create secret generic kaimahi-slack-mcp-key \
            --from-literal=SLACK_MCP_API_KEY=ci-not-a-real-credential \
            --dry-run=client -o yaml | kubectl --context kind-kaimahi-p1 apply -f -
          kubectl --context kind-kaimahi-p1 -n kaimahi rollout restart deploy/kaimahi-proxy
          kubectl --context kind-kaimahi-p1 -n kaimahi rollout status deploy/kaimahi-proxy --timeout=300s
      - name: "Slack post DENIED fail-closed and files an approval request"
        run: |
          UPSTREAM=slack GOVERNED_SECRET=kaimahi-slack-token \
            bash scripts/tool-denial-probe.sh conversations_add_message
          make slack-audit | tee slack-audit-denied.out
          grep -E 'hello-slack +slack +tools/call +conversations_add_message +denied +403' slack-audit-denied.out
      - name: "Bounded approval admits the post, exhaustion re-denies"
        run: |
          make approvals | tee approvals-slack.out
          id=$(awk '$3=="hello-slack" && $4=="tool" && $5=="conversations_add_message" {print $1}' approvals-slack.out)
          test -n "$id"
          make approve ID="$id" USES=1 TTL=10m
          # Admitted by the grant, then forwarded to an upstream that does
          # not exist. The probe FAILS on a 200 (it reached a tool server)
          # and on any 503 that is a pre-forward denial wearing a 503.
          UPSTREAM=slack GOVERNED_SECRET=kaimahi-slack-token \
            bash scripts/tool-admit-probe.sh conversations_add_message '{"channel_id": "C0CIONLY", "payload": "ci"}'
          make slack-audit | tee slack-audit-granted.out
          # Exactly 502: an admitted call that was dialed and unreachable.
          # 503 here would mean the gateway never forwarded at all.
          grep -E 'hello-slack +slack +tools/call +conversations_add_message +allowed +502 +granted' slack-audit-granted.out
          # The single use is consumed: denied again, and a fresh request filed.
          UPSTREAM=slack GOVERNED_SECRET=kaimahi-slack-token \
            bash scripts/tool-denial-probe.sh conversations_add_message
          make approval-audit | tee approval-audit-slack.out
          grep -E 'hello-slack +tool +conversations_add_message +approved' approval-audit-slack.out
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-kaimahi-p1 get pods -A || true
          kubectl --context kind-kaimahi-p1 -n kagent describe agent hello-world || true
          kubectl --context kind-kaimahi-p1 -n kagent logs deploy/hello-world --tail=100 || true
          kubectl --context kind-kaimahi-p1 -n kagent describe agent hello-tools || true
          kubectl --context kind-kaimahi-p1 -n kagent logs deploy/hello-tools --tail=100 || true
          kubectl --context kind-kaimahi-p1 -n kagent describe remotemcpserver kagent-tool-server || true
          kubectl --context kind-kaimahi-p1 -n kagent logs deploy/kagent-tools --tail=50 || true
          kubectl --context kind-kaimahi-p1 -n kaimahi get pods || true
          kubectl --context kind-kaimahi-p1 -n kaimahi logs deploy/kaimahi-proxy --tail=100 || true
          kubectl --context kind-kaimahi-p1 -n kaimahi logs deploy/kaimahi-postgres --tail=50 || true
          kubectl --context kind-kaimahi-p1 -n kaimahi get mcpserver -o wide || true
